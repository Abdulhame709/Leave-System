name: Disposable PostgreSQL auth lab

# A fresh PostgreSQL container per job. No Neon secret and no deployment.
on:
  push:
    branches: [arena/5a930501-leave-system]
    paths:
      - .github/workflows/postgres-auth-lab.yml
      - experiments/postgres-auth-lab/**
      - packages/security/**
      - package.json
      - package-lock.json
  pull_request:
    paths:
      - .github/workflows/postgres-auth-lab.yml
      - experiments/postgres-auth-lab/**
      - packages/security/**
      - package.json
      - package-lock.json
permissions:
  contents: read
jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lab
          POSTGRES_PASSWORD: local-only
          POSTGRES_DB: leave_lab_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lab -d leave_lab_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:postgres-lab
        env:
          PG_LAB_URL: postgresql://lab:local-only@127.0.0.1:5432/leave_lab_test
